<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Bem-vindo ao GitHub de Gabriel Rufino</title>
  <desc id="description">Gabriel Rufino, estudante de Engenharia de Software</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10101f" />
      <stop offset="0.55" stop-color="#191333" />
      <stop offset="1" stop-color="#102a3a" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" />
      <stop offset="1" stop-color="#67e8f9" />
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity=".045" />
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" />
    </filter>
  </defs>
  <rect width="1200" height="360" rx="22" fill="url(#background)" />
  <rect width="1200" height="360" rx="22" fill="url(#grid)" />
  <circle cx="1070" cy="95" r="145" fill="#7556df" opacity=".25" filter="url(#glow)" />
  <circle cx="1070" cy="280" r="125" fill="#27bfd3" opacity=".17" filter="url(#glow)" />
  <g fill="none" stroke="url(#accent)" stroke-linecap="round" stroke-width="2" opacity=".42">
    <path d="M1040 72h75a16 16 0 0 1 16 16v20h36" />
    <path d="M1060 266h72a16 16 0 0 0 16-16v-24h28" />
    <path d="M1135 143v27a16 16 0 0 0 16 16h29" />
  </g>
  <g fill="#111426" stroke="url(#accent)" stroke-width="2">
    <circle cx="1040" cy="72" r="5" />
    <circle cx="1167" cy="108" r="5" />
    <circle cx="1060" cy="266" r="5" />
    <circle cx="1176" cy="226" r="5" />
    <circle cx="1135" cy="143" r="5" />
    <circle cx="1180" cy="186" r="5" />
  </g>
  <rect x="577" y="66" width="46" height="4" rx="2" fill="url(#accent)" />
  <text x="600" y="151" text-anchor="middle" fill="#f8fafc" font-family="Trebuchet MS, Segoe UI, Arial, sans-serif" font-size="50" font-weight="700" letter-spacing="-1">Bem-vindo ao meu GitHub!</text>
  <text x="600" y="205" text-anchor="middle" fill="#d7d7e8" font-family="Trebuchet MS, Segoe UI, Arial, sans-serif" font-size="25">Gabriel Rufino</text>
  <text x="600" y="244" text-anchor="middle" fill="#b9bad0" font-family="Trebuchet MS, Segoe UI, Arial, sans-serif" font-size="19">Estudante de Engenharia de Software</text>
  <text x="600" y="290" text-anchor="middle" fill="#a8a7c3" font-family="Trebuchet MS, Segoe UI, Arial, sans-serif" font-size="15" letter-spacing="2">APRENDENDO · CONSTRUINDO · EVOLUINDO</text>
