name: Update profile summary cards

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.PRIVATE_CONTRIBUTIONS_TOKEN }}
        with:
          USERNAME: rufigab
          BRANCH_NAME: main
          THEME: github_dark